# 관리 화면에서 저장하면(main에 데이터가 바뀌면), 영어가 아직 한국어 그대로인 칸을 자동으로 번역해서 커밋해요.
# 필요한 것: GitHub 저장소 Settings → Secrets and variables → Actions → ANTHROPIC_API_KEY
name: 자동 번역

on:
  push:
    branches: [main]
    paths:
      - "src/components/works/worksData.json"
      - "src/components/exhibitions/exhibitionsData.json"
      - "src/components/about/aboutData.json"
  workflow_dispatch: {}

permissions:
  contents: write

# 저장을 연달아 해도 하나씩 차례로 번역해요
concurrency:
  group: auto-translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 사이트 전체 패키지는 필요 없고, 번역용 Claude SDK만 설치해요
      - name: Install Claude SDK
        run: npm install --prefix "$RUNNER_TEMP/sdk" --no-save --no-package-lock @anthropic-ai/sdk@1.8.0

      - name: Translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_PATH: ${{ runner.temp }}/sdk/node_modules
        run: node scripts/translate-data.js

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "바뀐 내용이 없어요"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/works/worksData.json src/components/exhibitions/exhibitionsData.json src/components/about/aboutData.json
          git commit -m "자동 번역: 영어 칸 채우기"
          # 그 사이에 관리 화면에서 또 저장했으면 그 위에 얹어서 올려요
          git pull --rebase origin main
          git push origin HEAD:main
